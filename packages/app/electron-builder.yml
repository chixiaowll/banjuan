appId: com.banjuan.app
productName: 半卷
copyright: Copyright © 2026
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - resources/**/*
  - "!node_modules/**/*.{ts,map,md,txt}"
  - "!node_modules/**/{test,tests,__tests__,docs,doc,example,examples,.github}/**"
  - "!node_modules/**/{CHANGELOG,changelog,README,readme,LICENSE,license,LICENCE}*"
  - "!node_modules/better-sqlite3/{deps,build/Release/obj,src,bin}/**"
  - "!node_modules/pdfjs-dist/**"
  - "!node_modules/mermaid/**"
  - "!node_modules/lucide-react/**"
  - "!node_modules/elkjs/**"
  - "!node_modules/@shikijs/**"
  - "!node_modules/shiki/**"
  - "!node_modules/@mantine/**"
  - "!node_modules/@blocknote/**"
  - "!node_modules/@codemirror/**"
  - "!node_modules/@xyflow/**"
  - "!node_modules/framer-motion/**"
  - "!node_modules/d3/**"
  - "!node_modules/epubjs/**"
  - "!node_modules/react/**"
  - "!node_modules/react-dom/**"
  - "!node_modules/react-markdown/**"
  - "!node_modules/zustand/**"
extraResources:
  - from: resources/cli-bundle/
    to: cli/
    filter:
      - "**/*"
  - from: ../../plugins/
    to: plugins/
    filter:
      - "**/*"
      - "!**/.runtime/**"
      - "!**/node_modules/**"
      - "!**/config.json"
  # pdfjs legacy build for server-side PDF text extraction (loaded at runtime by
  # the main process; not bundled because vite breaks its Node self-polyfill).
  - from: node_modules/pdfjs-dist/legacy/build/pdf.mjs
    to: pdfjs/pdf.mjs
  # pdf.js imports its worker module from next to pdf.mjs when run in Node.
  - from: node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs
    to: pdfjs/pdf.worker.mjs
  # Character maps: without them CJK PDFs (CID fonts) yield no or garbled text.
  - from: node_modules/pdfjs-dist/cmaps/
    to: pdfjs/cmaps/
extraMetadata:
  main: dist/main/index.js
mac:
  icon: resources/icon.icns
  artifactName: "banjuan-${version}-mac-${arch}.${ext}"   # the zip; the dmg has its own below
  category: public.app-category.productivity
  # "Open With → 半卷" for these (single-file windows). Alternate: offered, never
  # taking over as the default app unless the user makes it one.
  fileAssociations:
    - ext: pdf
      name: PDF Document
      role: Viewer
      rank: Alternate
    - ext: epub
      name: EPUB Book
      role: Viewer
      rank: Alternate
    - ext: [md, markdown]
      name: Markdown Document
      role: Editor
      rank: Alternate
    - ext: txt
      name: Plain Text
      role: Editor
      rank: Alternate
    - ext: [png, jpg, jpeg, gif, webp]
      name: Image
      role: Viewer
      rank: Alternate
    - ext: [html, htm]
      name: HTML Document
      role: Viewer
      rank: Alternate
  # banjuan://doc/<id>?page=…, /annotation/<id>, /note/<id> (deep-link.ts)
  protocols:
    - name: Banjuan Link
      schemes: [banjuan]
  # arch order matters: electron-builder rebuilds the native better-sqlite3 for
  # each target in turn, and the LAST one is what stays in node_modules. Build
  # x64 first and arm64 last so the dev machine (Apple Silicon) keeps a working
  # arm64 binary after packaging — no manual electron-rebuild needed.
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
# ASCII file names: GitHub mangles non-ASCII names of release assets on upload.
dmg:
  title: "半卷"
  artifactName: "banjuan-${version}-mac-${arch}.${ext}"
win:
  icon: resources/icon.png
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: resources/icon.png
  target:
    - AppImage
